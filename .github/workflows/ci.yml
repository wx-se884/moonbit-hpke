name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MoonBit stable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit stable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify MoonBit version
        shell: bash
        run: |
          moon --version
          moonc --version
          version="$(moonc --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | tr '.' ' ')"
          if [[ -z "$version" ]]; then
            echo "Unable to parse the MoonBit compiler version"
            exit 1
          fi
          read -r major minor patch <<< "$version"
          if (( major < 0 || (major == 0 && minor < 10) || (major == 0 && minor == 10 && patch < 9) )); then
            echo "MoonBit compiler v0.10.9 or newer is required"
            exit 1
          fi

      - name: Check formatting
        run: moon fmt --check

      - name: Typecheck with denied warnings
        run: moon check --deny-warn

      - name: Regenerate and review public interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Run default backend tests with coverage
        run: moon test --deny-warn --enable-coverage --no-parallelize

      - name: Run native tests
        run: moon test --target native --deny-warn --enable-coverage --no-parallelize

      - name: Run JavaScript tests
        run: moon test --target js --deny-warn --no-parallelize

      - name: Run WebAssembly tests
        run: moon test --target wasm --deny-warn --no-parallelize

      - name: Report coverage
        run: |
          moon coverage report -f summary
          moon coverage analyze

      - name: Run CLI demonstration
        run: moon run cmd/hpke-cli

      - name: Enforce executable source threshold
        shell: pwsh
        run: pwsh -NoProfile -File scripts/source_stats.ps1
